<!DOCTYPE html>
<html lang="pt-br">

<head>

    <link rel="stylesheet"

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed', // roxo profundo

                <p>

    </div>

</body>

</html>
